# --- Configuration globale Spring ---
spring.application.name=priseRDV
server.port=8081
spring.main.allow-bean-definition-overriding=true

# --- Configuration Camunda 8 / Zeebe ---
# ? L'ancienne ligne : zeebe.client.broker.grpcAddress=http://localhost:26500
# ? La bonne ligne (sans http://) :
zeebe.client.broker.gateway-address=127.0.0.1:26500
zeebe.client.security.plaintext=true

# --- Configuration des Logs ---
logging.level.io.camunda=INFO
logging.level.io.camunda.zeebe.client=DEBUG